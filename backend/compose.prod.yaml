---
# Production environment override
#
# Passwords have no defaults here: `${VAR:?}` makes compose refuse to start
# unless POSTGRES_PASSWORD and RABBITMQ_PASSWORD are set, so the dev
# placeholders from compose.yaml can never reach a real deployment.
#
# The prod image runs as www-data (rootless, synced from symfony-docker). If a
# deployment predates that and its caddy_data/caddy_config volumes were
# created by a root container, chown them once before switching images:
#   docker compose run --rm --user root --entrypoint chown php -R www-data:www-data /data /config
services:
  php:
    image: ${IMAGES_PREFIX:-}app-php-prod
    build:
      context: .
      target: frankenphp_prod
    environment:
      APP_SECRET: ${APP_SECRET:?}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?}@database:5432/${POSTGRES_DB:-app}?serverVersion=18&charset=${POSTGRES_CHARSET:-utf8}
      MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER:-hestia}:${RABBITMQ_PASSWORD:?}@rabbitmq:5672/%2f/messages
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}

  messenger:
    image: ${IMAGES_PREFIX:-}app-php-prod
    build:
      context: .
      target: frankenphp_prod
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?}@database:5432/${POSTGRES_DB:-app}?serverVersion=18&charset=${POSTGRES_CHARSET:-utf8}
      MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER:-hestia}:${RABBITMQ_PASSWORD:?}@rabbitmq:5672/%2f/messages

  database:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}

  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
