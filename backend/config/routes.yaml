# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# This file is the entry point to configure the routes of your app.
# Methods with the #[Route] attribute are automatically imported.
# See also https://symfony.com/doc/current/routing.html

# To list all registered routes, run the following command:
#   bin/console debug:router

controllers:
    resource: routing.controllers

# Internal API v1 routes
api_internal_v1:
    resource: '../src/Controller/Api/Internal/V1/'
    type: attribute
    prefix: /api/internal/v1

# API documentation: dev only. Prod has no reason to hand out the full
# route/DTO map to anonymous clients; the frontend regenerates its client
# from a dev backend (frontend/AGENTS.md).
when@dev:
    api_doc:
        path: /api/doc
        methods: GET
        defaults:
            _controller: nelmio_api_doc.controller.swagger_ui

    api_doc_json:
        path: /api/doc.json
        methods: GET
        defaults:
            _controller: nelmio_api_doc.controller.swagger_json
