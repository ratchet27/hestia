when@dev: &dev
    # See full configuration: https://symfony.com/bundles/ZenstruckFoundryBundle/current/index.html#full-default-bundle-configuration
    zenstruck_foundry:
        persistence:
            # Flush only once per call of `PersistentObjectFactory::create()`
            flush_once: true

    # Factories and the dev fixture story live under tests/ (dev-only dependency);
    # register them as services here so Foundry can autowire them in dev and test.
    services:
        App\Tests\Factory\:
            resource: '%kernel.project_dir%/tests/Factory/'
            autowire: true
            autoconfigure: true
        App\Tests\Story\:
            resource: '%kernel.project_dir%/tests/Story/'
            autowire: true
            autoconfigure: true

when@test: *dev
