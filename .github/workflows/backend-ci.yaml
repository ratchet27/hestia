---
name: Backend CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker images
        working-directory: backend
        env:
          # Passed via env, not interpolated into the script: a ref name is
          # attacker-influenced text and must not be expanded as shell code.
          CACHE_SCOPE: ${{ github.ref }}
        run: |
          docker buildx bake \
            --file compose.yaml \
            --file compose.override.yaml \
            --set "*.cache-from=type=gha,scope=${CACHE_SCOPE}" \
            --set '*.cache-from=type=gha,scope=refs/heads/master' \
            --set "*.cache-to=type=gha,scope=${CACHE_SCOPE},mode=max" \
            --pull \
            --load
      - name: Start services
        run: docker compose -f compose.yaml -f compose.override.yaml -f compose.ci.yaml up --wait --no-build
      - name: Check HTTP reachability
        run: curl -v --fail-with-body http://localhost
      - name: Run PHPUnit
        run: docker compose exec -T php bin/phpunit
      - name: Doctrine mapping validator
        # --skip-sync: the DB legitimately differs from the mapping by one
        # partial unique index (shopping_list_product_unique) that Doctrine
        # cannot express; only the mapping itself is checked here.
        run: docker compose exec -T php bin/console -e test doctrine:schema:validate --skip-sync
