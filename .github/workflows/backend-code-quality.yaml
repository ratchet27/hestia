---
name: Backend Code Quality

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup PHP with Composer cache
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer
        env:
          COMPOSER_ALLOW_SUPERUSER: 1

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Setup Mago
        uses: nhedger/setup-mago@v2

      # Mirrors `make lint` order: rector -> mago -> phpstan.
      # CI runs each tool in check mode; locally `make lint` auto-fixes.
      - name: Run Rector
        run: vendor/bin/rector process --dry-run --no-progress-bar

      - name: Run Mago
        run: |
          mago format --check
          mago lint --reporting-format=github --minimum-report-level=warning
          mago analyze --reporting-format=github --minimum-report-level=warning

      - name: Run PHPStan
        run: |
          vendor/bin/phpstan analyse \
            --error-format=github \
            --no-progress \
            --memory-limit=512M
