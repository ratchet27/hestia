---
name: Backend Code Quality

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup PHP with Composer cache
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer
        env:
          COMPOSER_ALLOW_SUPERUSER: 1

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Setup Mago
        uses: nhedger/setup-mago@v2

      - name: Run Mago
        run: |
          mago format --check
          mago lint --reporting-format=github --minimum-report-level=warning
          mago analyze --reporting-format=github --minimum-report-level=warning
